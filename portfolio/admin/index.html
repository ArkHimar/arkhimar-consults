<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><meta name="theme-color" content="#0b1220"><meta name="description" content="Private ArkHimar portfolio publishing dashboard."><link rel="stylesheet" href="/portfolio/styles.css"><link rel="stylesheet" href="/portfolio/admin.css"><link rel="icon" href="/favicon.svg" type="image/svg+xml"><title>Portfolio Admin — ArkHimar</title></head><body class="admin-page">
<header class="site-header"><div class="container header-inner"><a class="logo" href="/portfolio">Ark<span>Himar</span></a><a class="secondary-button" href="/portfolio">View portfolio</a></div></header>
<main class="admin-main"><section class="admin-shell" data-login><p class="eyebrow">Private access</p><h1>Portfolio admin</h1><p>Sign in with your authorised ArkHimar account.</p><form class="admin-form" data-login-form><label>Email<input name="email" type="email" autocomplete="username" required></label><label>Password<input name="password" type="password" autocomplete="current-password" required></label><button class="primary-button" type="submit">Sign in</button><p class="form-status" data-login-status role="status"></p></form></section>
<section class="admin-dashboard" data-dashboard hidden><div class="admin-title"><div><p class="eyebrow">Portfolio publisher</p><h1>Manage projects</h1></div><button class="secondary-button" type="button" data-sign-out>Sign out</button></div><div class="admin-layout"><form class="admin-form admin-editor" data-project-form><input name="id" type="hidden"><label>Project title<input name="title" maxlength="120" required></label><label>Practice<select name="practice" required><option value="automation">AI &amp; Automation</option><option value="development">Development</option><option value="architecture">Architecture</option><option value="design">Graphic Design</option></select></label><label class="full">Summary<textarea name="summary" maxlength="1000" required></textarea></label><label>Status<input name="status" value="Completed" maxlength="40" required></label><label>Sort order<input name="sort_order" type="number" value="100"></label><label class="full">Project link<input name="external_url" type="url" placeholder="https://…"></label><label class="full">Tags<input name="tags" placeholder="Branding, Social, Print"></label><label class="full">Cover image<input name="image" type="file" accept="image/jpeg,image/png,image/webp,image/gif,image/avif"><small>JPEG, PNG, WebP, GIF or AVIF, maximum 20 MB.</small></label><label class="publish-check"><input name="published" type="checkbox"> Publish immediately</label><div class="admin-actions"><button class="primary-button" type="submit">Save project</button><button class="secondary-button" type="button" data-reset>Clear</button></div><p class="form-status" data-editor-status role="status"></p></form><section><h2>Projects</h2><div class="project-list" data-project-list></div></section></div></section></main>
<script src="/runtime-config.js"></script><script type="module" src="/portfolio/admin.js"></script></body></html>
